[package]
name = "best_file_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
http = "1.3.1"
reqwest = "0.12.22"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["fs"] }
url = "2.5.7"
