[package]
name = "downlowd"
version = "0.1.0"
edition = "2024"

[dependencies]
http = "1.3.1"
reqwest = { version = "0.12.22", optional = true }
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["fs", "macros"], optional = true }
ureq = { version = "3.1.2", optional = true }
url = { version = "2.5.7", optional = true }
urlencoding = "2.1.3"

[dev-dependencies]
httptest = "0.16.3"
indicatif = "0.18.0"
rand = "0.9.2"
temp-dir = "0.1.16"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "time", "net"] }
tokio-test = "0.4.4"
ureq = "3.1.2"

[features]
default = ["async"]
async = ["dep:tokio", "dep:reqwest", "dep:url"]
blocking = ["dep:ureq"]

[[example]]
name = "dl"
