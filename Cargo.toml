[package]
name = "downlowd"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.7.1"
http = "1.3.1"
reqwest = "0.12.22"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["fs"] }
url = "2.5.7"
urlencoding = "2.1.3"

[dev-dependencies]
httptest = "0.16.3"
indicatif = "0.18.0"
rand = "0.9.2"
temp-dir = "0.1.16"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "time"] }
tokio-test = "0.4.4"

[[example]]
name = "dl"
